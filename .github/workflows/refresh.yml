name: refresh events

# Pulls fresh events for every group and commits data/cache/ if anything
# changed. That push is what makes Cloudflare rebuild and deploy the site.
# Run it by hand from the Actions tab (or `gh workflow run refresh.yml`) to
# refresh right away.

on:
  schedule:
    # 10:20 UTC = 5:20am Des Moines in summer, 4:20am in winter. Off the hour
    # because GitHub queues on-the-hour schedules and runs them late.
    - cron: '20 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run fetch
      # Build before committing, so data that breaks the site never gets pushed.
      - run: npm run build
      - name: commit changed event data
        run: |
          git add data/cache
          if git diff --cached --quiet; then
            echo "No event changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh event data" -m "$(git diff --cached --stat | tail -1)"
          git push
