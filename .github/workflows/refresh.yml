name: refresh events

# Pulls fresh events for every group four times a day and commits data/cache/
# if anything changed. That push is what makes Cloudflare rebuild and deploy
# the site.
# Run it by hand from the Actions tab (or `gh workflow run refresh.yml`) to
# refresh right away.

on:
  schedule:
    # 10:20, 15:20, 19:20, 23:20 UTC = 5:20am, 10:20am, 2:20pm, 6:20pm
    # Des Moines in summer (an hour earlier in winter): before the workday,
    # mid-morning, mid-afternoon, and just before evening meetups start. Off
    # the hour because GitHub queues on-the-hour schedules and runs them late.
    - cron: '20 10,15,19,23 * * *'
    # Just after midnight Sunday night in Des Moines (01:05 summer, 00:05
    # winter), so "This week" / "Next week" roll over at midnight, not 5:20am.
    - cron: '5 6 * * 1'
  workflow_dispatch:

# main is protected by a ruleset (changes go through PRs with a green ci
# check). This workflow is the one exception: it pushes with a deploy key,
# which the ruleset lets bypass the rules. The key's private half is the
# REFRESH_DEPLOY_KEY secret; the public half is under Settings → Deploy keys.
#
# Two jobs, so the key never shares a machine with third-party code. `refresh`
# runs `npm ci`, the fetch and the build (npm packages, group websites) and
# hands over only data/cache and data/archive as an artifact. `publish` starts
# on a fresh runner, installs and runs nothing from npm, and is the only job
# that sees the key. In one job, an earlier step could leave something behind
# for the push step: a git hook or config, a line in $GITHUB_ENV or
# $GITHUB_PATH, or a process that reads the next step's environment.
permissions:
  contents: read

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    # A run takes about a minute; the fetch caps each request at 20s.
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write # source-issues.mjs opens/closes "Source broken" issues
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run fetch
      # One GitHub issue per group that failed (updated, not duplicated, on
      # later runs; closed when it works again). A problem here never stops
      # the refresh: the failed group just keeps its last events.
      - name: report broken sources
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/source-issues.mjs
      # Build before handing the data over, so data that breaks the site never
      # gets pushed.
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: event-data
          path: |
            data/cache/
            data/archive/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: refresh
    runs-on: ubuntu-24.04
    # The live check below waits up to 10 minutes.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: event-data
          path: ${{ runner.temp }}/event-data
      - name: commit changed event data
        id: commit
        env:
          DEPLOY_KEY: ${{ secrets.REFRESH_DEPLOY_KEY }}
          NEW: ${{ runner.temp }}/event-data
        run: |
          # Mirror the refresh job's data exactly, so a file it dropped is
          # dropped here too.
          test -d "$NEW/cache" && test -d "$NEW/archive"
          rm -rf data/cache data/archive
          cp -R "$NEW/cache" data/cache
          cp -R "$NEW/archive" data/archive
          # The page's "This week" / "Next week" headings are fixed at build
          # time, so the site has to rebuild at least once a day even when no
          # group posted anything. Recording the Des Moines date makes the
          # first run each day commit.
          TZ=America/Chicago date +%F > data/cache/built-on.txt
          git add -A data/cache data/archive
          if git diff --cached --quiet; then
            echo "No event changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh event data" -m "$(git diff --cached --stat | tail -1)"
          # The deploy key exists on disk only from here to the end of the
          # step. GitHub's host keys come from its API over HTTPS, so ssh
          # still checks who it is talking to.
          ssh_dir="$RUNNER_TEMP/deploy-ssh"
          mkdir -m 700 "$ssh_dir"
          trap 'rm -rf "$ssh_dir"' EXIT
          (umask 077 && printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/key")
          curl -fsS https://api.github.com/meta | jq -r '.ssh_keys[] | "github.com " + .' > "$ssh_dir/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $ssh_dir/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$ssh_dir/known_hosts"
          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
          # A PR may merge while this run fetches and builds, or between the
          # pull and the push. Replay the data commit on top and try again
          # rather than fail the run.
          for try in 1 2 3; do
            if git pull --rebase --quiet && git push; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push attempt $try failed; retrying."
            sleep $((try * 5))
          done
          echo "::error::Couldn't push the data commit after 3 tries."
          exit 1
      # The push only asks Cloudflare to deploy. Wait for the live home page to
      # carry this commit (its <meta name="build">, which Cloudflare's build
      # fills in from WORKERS_CI_COMMIT_SHA), or a later one, and fail the run
      # if it hasn't after 10 minutes, so a failed deploy doesn't go unnoticed.
      - name: check the push went live
        if: steps.commit.outputs.sha
        env:
          SHA: ${{ steps.commit.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 20); do
            sleep 30
            live=$(curl -fsS "https://dsmtechevents.com/?deploy-check=$SHA" | grep -o '<meta name="build" content="[0-9a-f]*"' | grep -o '[0-9a-f]\{40\}' || true)
            if [ "$live" = "$SHA" ]; then echo "Live: $live"; exit 0; fi
            # A PR merged right after this push: its build carries ours too.
            if [ -n "$live" ] && [ "$(gh api "repos/$GITHUB_REPOSITORY/compare/$SHA...$live" --jq .status 2>/dev/null)" = ahead ]; then echo "Live: $live (includes $SHA)"; exit 0; fi
            echo "Live is ${live:-unknown}, waiting for $SHA"
          done
          echo "::error::$SHA was pushed but dsmtechevents.com still serves ${live:-an unknown build} after 10 minutes. Check Workers Builds in the Cloudflare dashboard."
          exit 1
