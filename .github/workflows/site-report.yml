name: site report

# Once a week, a site report on the run's own page: visits, page views, top
# pages and where visits come from (Cloudflare Web Analytics), then outbound
# clicks (which groups and events the site sends people to), then Lighthouse
# scores for a few key pages (scripts/lighthouse-report.mjs). Open the latest
# run under Actions → site report, or run it with `gh workflow run site-report.yml`.
# Needs the CF_ANALYTICS_TOKEN secret (Cloudflare "Account Analytics: Read").

on:
  schedule:
    # Mondays 14:50 UTC (9:50am Des Moines in summer). Off the hour because
    # GitHub runs on-the-hour schedules late.
    - cron: '50 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read # to download last week's lighthouse artifact

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - name: write the site report to this run's summary
        env:
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
        run: node scripts/site-report.mjs
      # Lighthouse runs after the analytics part (and even if that failed); a
      # Lighthouse problem never fails the run.
      - name: download last week's Lighthouse numbers
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list --workflow site-report.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId' --repo "$GITHUB_REPOSITORY")
          if [ -n "$id" ]; then gh run download "$id" --name lighthouse --dir prev --repo "$GITHUB_REPOSITORY" || echo "no lighthouse artifact on run $id"; fi
      - name: add Lighthouse scores to this run's summary
        id: lighthouse
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: node scripts/lighthouse-report.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.lighthouse.outcome == 'success' }}
        with:
          name: lighthouse
          path: lighthouse.json
          retention-days: 90
