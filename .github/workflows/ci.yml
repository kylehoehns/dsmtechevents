name: ci

# Runs the tests and the build on every pull request and every push to main.
# `npm run build` runs the tests first, so this one step covers both; the
# same command runs in Cloudflare's deploy and the event refresh, so a failing
# test also blocks a deploy and a data commit.

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: this workflow runs third-party code (npm packages) and
# never needs to write anything.
permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      # Spelling in our own words: page copy and the docs (cspell.json). Event
      # text from the groups isn't checked. Here rather than in the build, so
      # a typo never blocks a data refresh or a deploy.
      - run: npm run spell
      # The share image, icons and badge come from scripts the build doesn't
      # run, so a dependency update could break them unnoticed. Run them here
      # (the output isn't committed).
      - name: image scripts still run
        run: npm run og && npm run icons

  # Browser tests (tests/e2e): builds the site from fixture data at a fixed
  # date and drives it in Chromium, desktop and phone sizes, including axe
  # accessibility checks. Its own check, so a failure here is easy to spot.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - id: pw
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # Downloads Chromium only on a cache miss; the system libraries always.
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
