name: ci

# Runs the tests and the build on every pull request and every push to main.
# `npm run build` runs the tests first, so this one step covers both; the
# same command runs in Cloudflare's deploy and the event refresh, so a failing
# test also blocks a deploy and a data commit.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      # The share image, icons and badge come from scripts the build doesn't
      # run, so a dependency update could break them unnoticed. Run them here
      # (the output isn't committed).
      - name: image scripts still run
        run: npm run og && npm run icons

  # Browser tests (tests/e2e): builds the site from fixture data at a fixed
  # date and drives it in Chromium, desktop and phone sizes, including axe
  # accessibility checks. Its own check, so a failure here is easy to spot.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - id: pw
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # Downloads Chromium only on a cache miss; the system libraries always.
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
