name: Add any other group or event
description: Not on Luma or Meetup, like a conference site or a group's own website or calendar. Tell us the details and we'll add it.
title: 'Add: '
labels: [listing]
body:
  - type: markdown
    attributes:
      value: |
        DSM Tech Events lists public, community, tech events in and around Des Moines. We link to your page, and people sign up there.
        **On Meetup or Luma?** Use [Add a Luma event or Meetup group](https://github.com/kylehoehns/dsmtechevents/issues/new?template=1-add-from-link.yml) instead: it's quicker, and you get a preview within minutes.
  - type: input
    id: name
    attributes:
      label: Group or event name
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Website or public calendar link
      description: For a group, its website or a public calendar (.ics) link. For an event, its page.
      placeholder: https://your-group.org/
    validations:
      required: true
  - type: textarea
    id: one-off
    attributes:
      label: For a one-off event (conference, workshop, hack day)
      description: Date, start and end time, venue and address, and a link where people sign up or learn more. Leave blank for a group.
      placeholder: |
        Date: 2026-11-07
        Time: 8:00am to 5:00pm
        Venue and address: ...
        Sign-up link: https://...
  - type: textarea
    id: notes
    attributes:
      label: Anything else we should know
  - type: checkboxes
    id: fits
    attributes:
      label: Does it fit?
      options:
        - label: It's open to the public, paid or free. No members-only or invite-only events.
          required: true
        - label: It's a community event focused on tech (software, data, security, product, design, hardware and so on), or a local chapter of an association for people who work in tech (project management, business analysis and the like).
          required: true
        - label: It's in the Des Moines area, or online and run by a local group.
          required: true
