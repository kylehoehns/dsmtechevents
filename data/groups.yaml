# Every group the site tracks. Adding a Meetup group is one entry here.
#
#   id:       short unique key (used in URLs and filters)
#   name:     display name
#   short:    abbreviation shown on calendar pills
#   meetup:   the group's Meetup page — its events are pulled in four times a day
#   ical:     (optional) any other public .ics feed, for groups not on Meetup
#             or to override the Meetup feed. A Luma calendar has one:
#             https://api.lu.ma/ics/get?entity=calendar&id=cal-…
#   source:   (optional) for groups with no feed: the name of a reader in
#             scripts/sources/ that pulls events from their own website
#   website:  for groups not on Meetup only: their own site, where their link
#             goes and, unless an eventbrite: is given, where events are read. A Meetup group gets one
#             link, its Meetup page, so there's one address to keep current.
#   eventbrite: (optional) an Eventbrite collection (/cc/…) the eventbrite
#             reader pulls events from, for groups that post there
#   logo:     (optional) image URL, for groups whose logo isn't read from Meetup

