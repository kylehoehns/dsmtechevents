# The #local-links message, posted by scripts/discord-local-links.mjs after
# each apply as one Components V2 card. Edit here; the next apply edits the
# message in place (no new post, no ping).
#
# Each link: `name`, one plain line of `about`, and `url` (the button). Keep
# each section A to Z, and leave out member counts: they go stale and read as
# a ranking. A Discord invite must be one that never expires: check with
# https://discord.com/api/v10/invites/<code>?with_expiration=true
# (expires_at: null). <#${general}> is a channel mention.

